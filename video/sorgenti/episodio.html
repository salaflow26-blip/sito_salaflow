<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SalaFlow — funzione per funzione</title>
<style>
@font-face{font-family:PJS;font-weight:500;src:url(font/PJS-500.ttf)}
@font-face{font-family:PJS;font-weight:600;src:url(font/PJS-600.ttf)}
@font-face{font-family:PJS;font-weight:700;src:url(font/PJS-700.ttf)}
@font-face{font-family:PJS;font-weight:800;src:url(font/PJS-800.ttf)}
:root{--g1:#22d3ee;--g2:#2dd4bf;--g3:#34d399;--ink:#020617}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:PJS;background:var(--ink)}
#bg{position:absolute;inset:0;background:var(--ink)}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(120px);opacity:.34}
#gw1{background:radial-gradient(circle,#22d3ee,transparent 65%)}
#gw2{background:radial-gradient(circle,#34d399,transparent 65%)}
#grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:90px 90px}
/* intro */
#intro{position:absolute;inset:0;overflow:hidden}
#intro .grad{position:absolute;inset:-12%;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%)}
#intro .hl{position:absolute;left:0;top:0;width:820px;height:820px;border-radius:50%;filter:blur(90px);background:rgba(255,255,255,.3)}
#ichip{position:absolute;left:80px;top:560px;padding:12px 26px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:30px;letter-spacing:.1em}
#ichip b{color:var(--g2)}
#ititle{position:absolute;left:80px;top:660px;width:920px}
.ln{display:block;font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.95;white-space:nowrap;transform-origin:0% 100%;color:var(--ink)}
.wt{color:#fff}
#isub{position:absolute;left:80px;width:900px;font-weight:700;font-size:46px;line-height:1.25;color:var(--ink)}
/* caption */
#cap{position:absolute;left:70px;right:70px;top:120px;height:350px}
#capbg{position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(180deg,var(--ink) 0%,var(--ink) 74%,rgba(2,6,23,0) 100%)}
#prog{position:absolute;left:70px;right:70px;top:78px;height:8px;display:flex;gap:8px}
#prog i{flex:1;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
#prog i b{position:absolute;inset:0;background:linear-gradient(90deg,var(--g1),var(--g3));transform-origin:0 50%}
#chip{position:absolute;left:0;top:14px;font-weight:700;font-size:28px;letter-spacing:.12em;color:#94a3b8;white-space:nowrap}
#chip b{color:var(--g2)}
.ct{position:absolute;left:0;right:0;top:66px;font-weight:800;font-size:76px;line-height:1.02;letter-spacing:-.035em;color:#fff}
.ct em{font-style:normal;background:linear-gradient(110deg,var(--g1),var(--g2) 50%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.cs{position:absolute;left:0;right:0;font-weight:600;font-size:40px;line-height:1.28;color:#cbd5e1}
/* phone */
#cam{position:absolute;inset:0}
#phw{position:absolute;left:0;top:0;width:716px;height:1404px;transform-origin:0 0}
#frame{position:absolute;inset:0;border-radius:78px;background:#0b1220;box-shadow:0 0 0 2px rgba(148,163,184,.28),0 60px 120px -30px rgba(0,0,0,.85),0 0 90px -10px rgba(45,212,191,.25)}
#scr{position:absolute;left:14px;top:14px;width:688px;height:1376px;border-radius:64px;overflow:hidden;background:var(--ink)}
#scr img{position:absolute;left:0;top:0;width:100%;height:100%}
#notch{position:absolute;left:50%;top:26px;width:150px;height:38px;margin-left:-75px;border-radius:20px;background:#000}
#taps{position:absolute;left:14px;top:14px;width:688px;height:1376px;pointer-events:none}
.fing{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:5px solid #fff;box-shadow:0 0 40px rgba(255,255,255,.6)}
.rip{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid #fff}
.arc{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px}
.hbox{position:absolute;border:5px solid #fff;border-radius:22px;box-shadow:0 0 0 3000px rgba(2,6,23,.45),0 0 40px rgba(255,255,255,.55)}
/* end */
#end{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 42%,rgba(45,212,191,.16),transparent 70%),var(--ink)}
#logo{position:absolute;left:440px;top:520px;width:200px;height:200px;border-radius:22.5%;overflow:hidden;box-shadow:0 40px 90px -20px rgba(45,212,191,.55)}
#logo img{width:100%;height:100%;display:block;transform:scale(1.025)}
.word{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.gt{background:linear-gradient(110deg,var(--g1),var(--g2) 50%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.small{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#fff}
.pill{position:absolute;left:50%;padding:30px 58px;border-radius:999px;font-weight:800;font-size:48px;color:var(--ink);white-space:nowrap;
  background:linear-gradient(110deg,var(--g1),var(--g2) 50%,var(--g3));box-shadow:0 20px 60px -15px rgba(45,212,191,.7)}
#grain{position:absolute;inset:-50%;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="glow" id="gw1"></div><div class="glow" id="gw2"></div><div id="grid"></div></div>
  <div id="cam">
    <div id="phw"><div id="frame"></div><div id="scr"></div><div id="notch"></div><div id="taps"></div></div>
  </div>
  <div id="capbg"></div><div id="prog"></div>
  <div id="cap"><div id="chip"></div></div>
  <div id="intro"><div class="grad" id="grad"></div><div class="hl" id="hl1"></div><div class="hl" id="hl2"></div>
    <div id="ichip"></div><div id="ititle"></div><div id="isub"></div></div>
  <div id="end">
    <div id="logo"><img src="../../logo.png"></div>
    <div class="word" id="e0" style="top:780px;font-size:120px"><span style="color:#fff">Sala</span><span class="gt">Flow</span></div>
    <div class="small" id="e1" style="top:950px;font-size:44px">Presto disponibile</div>
    <div class="pill" id="e2" style="top:1060px">Prenota una visita</div>
    <div class="small" id="e3" style="top:1220px;font-size:46px">salaflow.com</div>
  </div>
  <canvas id="grain"></canvas><div id="flash"></div><div id="fade"></div>
</div>
<script>
/* "Funzione per funzione": ?f=<episode id>. The app screens are real screenshots recorded by the director
   scripts (build/ep/<id>/N.png + steps.json: caption, where the finger taps, optional zoom box in css px).
   Timeline in beats of the demo track (112 BPM): 8-beat intro, one step per `b` beats (default 8), 8-beat end card.
   Each tap lands one beat before the step ends, on the beat. */
const EPISODES = {
  prenota:   { n: 1,  file: 'prenotazioni',     tag: 'PRENOTAZIONI',        title: ['Una prenotazione,', 'dall’inizio'],   sub: 'Nome, persone, tavolo consigliato, walk-in: tutto quello che succede quando squilla il telefono.' },
  serata:    { n: 2,  file: 'serata',           tag: 'LA SERATA',           title: ['La serata', 'a colpo d’occhio'],     sub: 'Contatori, filtri, arrivi con uno swipe, no show, modifiche al volo e ricerca.' },
  piantina:  { n: 3,  file: 'piantina',         tag: 'PIANTINA',            title: ['La tua sala,', 'disegnata da te'],    sub: 'Tavoli colorati in tempo reale, l’editor della piantina e la piantina speciale solo per stasera.' },
  servizio:  { n: 4,  file: 'servizio',         tag: 'SERVIZIO',            title: ['Il servizio', 'in diretta'],          sub: 'Tavoli seduti, “pronti per ordinare”, tavolo liberato e il promemoria dopo un’ora e mezza.' },
  allergeni: { n: 5,  file: 'allergeni',        tag: 'ALLERGENI',           title: ['Allergie?', 'Mai più a memoria'],     sub: 'Dall’accoglienza alla comanda: i piatti a rischio escono in rosso.' },
  comanda:   { n: 6,  file: 'comanda',          tag: 'COMANDA',             title: ['La comanda,', 'dal tavolo'],          sub: 'Uscite, quantità, ingredienti ±, cucina e bar, riepilogo e invio.' },
  cassa:     { n: 7,  file: 'cassa',            tag: 'CASSA',               title: ['Il conto,', 'già pronto'],            sub: 'Coperto automatico, dividi, abbuono, pagamento, sospesi e il riepilogo della serata.' },
  menu:      { n: 8,  file: 'menu',             tag: 'MENU',                title: ['Il tuo menu,', 'dentro l’app'],       sub: 'Categorie, piatti, allergeni, cucina e bar, e l’import del menu da PDF o foto.' },
  online:    { n: 9,  file: 'prenotazioni-online', tag: 'PRENOTAZIONI ONLINE', title: ['Prenotano', 'da soli'],          sub: 'Il link del locale, il modulo del cliente, la richiesta in app: accetti con un tocco.' },
  staff:     { n: 10, file: 'staff',            tag: 'STAFF',               title: ['Tutto lo staff,', 'un solo tablet'],  sub: 'Inviti, ruoli, profili con PIN e la cronologia di chi ha fatto cosa.' },
  storico:   { n: 11, file: 'storico-grafici',  tag: 'STORICO E GRAFICI',   title: ['Ogni serata', 'resta scritta'],       sub: 'Storico, coperti nel tempo, picchi di arrivi, tempo medio al tavolo ed export Excel.' },
  cucina:    { n: 13, file: 'schermo-cucina',   tag: 'SCHERMO CUCINA',      title: ['La cucina', 'vede tutto'],          sub: 'Le comande arrivano su un tablet in cucina e al bar: si spuntano i piatti e si manda in sala.', device: 'tablet' },
  asporto:   { n: 12, file: 'asporto',          tag: 'ASPORTO',             title: ['L’asporto,', 'anche dal sito'],       sub: 'Il cliente ordina dalla pagina del locale, l’ordine arriva in app e parte la comanda.' },
};
const ID = new URLSearchParams(location.search).get('f') || 'prenota', EP = EPISODES[ID];
const BAR = 2.1413, BEAT = BAR / 4, INTRO = 8 * BEAT, OUTRO = 8 * BEAT;
// Device frame: phone = 430x860 css screenshots shown 688x1376; tablet = 768x1024 css shown 860x1147.
// K converts the recorded css px (taps, zoom boxes) to px on the stage screen.
const DEV = EP.device === 'tablet' ? { css: 768, sw: 860, sh: 1147, r: 40 } : { css: 430, sw: 688, sh: 1376, r: 64 };
const K = DEV.sw / DEV.css, PW = DEV.sw + 28, PH = DEV.sh + 28;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b, e = x => x) => e(cl((t - a) / (b - a)));
const outX = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x), inC = x => x * x * x, ioC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outB = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $id = i => document.getElementById(i), tf = (e, s) => e.style.transform = s, op = (e, v) => e.style.opacity = v;
const show = (e, on) => { e.style.display = on ? '' : 'none'; return on; };
const mkEl = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };

let STEPS = [], T0 = [], DUR = [], END = 0;
const PH_X = (1080 - PW) / 2, PH_Y = EP.device === 'tablet' ? 560 : 505;
for (const [id, w, h] of [['phw', PW, PH], ['scr', DEV.sw, DEV.sh], ['taps', DEV.sw, DEV.sh]]) Object.assign($id(id).style, { width: w + 'px', height: h + 'px' });
$id('frame').style.borderRadius = DEV.r + 14 + 'px'; $id('scr').style.borderRadius = DEV.r + 'px'; if (EP.device === 'tablet') $id('notch').style.display = 'none';
// caption markup: *word* -> gradient
const md = s => s.replace(/\*(.+?)\*/g, '<em>$1</em>');

async function load() {
  await new Promise((r, j) => { const sc = document.createElement('script'); sc.src = `build/ep/${ID}/steps.js`; sc.onload = r; sc.onerror = j; document.head.appendChild(sc); });
  STEPS = window.EP_STEPS;
  let t = INTRO;
  STEPS.forEach((s, i) => { T0[i] = t; DUR[i] = (s.b || 8) * BEAT; t += DUR[i]; });
  END = t + OUTRO; window.DURATION = END;
  window.TIMELINE = { taps: [], steps: T0.slice(), intro: INTRO, end: END };
  const scr = $id('scr'), taps = $id('taps'), cap = $id('cap'), prog = $id('prog');
  STEPS.forEach((s, i) => {
    s.img_el = mkEl('img', '', scr); s.img_el.src = `build/ep/${ID}/${s.img}`;
    s.t_el = mkEl('div', 'ct', cap, md(s.t)); s.s_el = mkEl('div', 'cs', cap, md(s.s || ''));
    s.bar = mkEl('b', '', mkEl('i', '', prog));
    (s.taps || []).forEach((tp, k, all) => {
      tp.at = T0[i] + DUR[i] - BEAT * (all.length - k) * (tp.kind === 'press' ? 2 : 1) - (tp.kind === 'press' ? 0 : 0);
      tp.f = mkEl('div', 'fing', taps); tp.r = mkEl('div', 'rip', taps);
      if (tp.kind === 'press') { tp.a = mkEl('div', 'arc', taps, '<svg viewBox="0 0 150 150" width="150" height="150"><circle cx="75" cy="75" r="68" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427" transform="rotate(-90 75 75)"/></svg>'); }
      const [x, y, w, h] = tp.b; tp.cx = (x + w / 2) * K; tp.cy = (y + h / 2) * K;
      for (const e of [tp.f, tp.r, tp.a].filter(Boolean)) { e.style.left = tp.cx + 'px'; e.style.top = tp.cy + 'px'; }
      window.TIMELINE.taps.push({ t: tp.at, kind: tp.kind });
    });
    if (s.zoom) s.hb = mkEl('div', 'hbox', taps);
  });
  $id('ichip').innerHTML = `SALAFLOW · FUNZIONE <b>${String(EP.n).padStart(2, '0')}</b>`;
  $id('chip').innerHTML = `FUNZIONE ${String(EP.n).padStart(2, '0')} · <b>${EP.tag}</b>`;
  EP.L = EP.title.map((w, k) => mkEl('span', 'ln ' + (k ? 'wt' : ''), $id('ititle'), w));
  $id('isub').textContent = EP.sub;
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)));
  // fit: intro title lines to 920px, caption title to one or two lines, subtitle right below
  EP.L.forEach(e => { let fs = 150; e.style.fontSize = fs + 'px'; while (e.scrollWidth > 920 && fs > 60) { fs -= 4; e.style.fontSize = fs + 'px'; } });
  $id('isub').style.top = (660 + $id('ititle').offsetHeight + 40) + 'px';
  STEPS.forEach(s => { let fs = 76; s.t_el.style.fontSize = fs + 'px'; while (s.t_el.offsetHeight > 170 && fs > 50) { fs -= 2; s.t_el.style.fontSize = fs + 'px'; }
    s.s_el.style.top = (66 + s.t_el.offsetHeight + 18) + 'px'; });
}

const grain = $id('grain'); grain.width = grain.height = 512;
{ const g = grain.getContext('2d'), im = g.createImageData(512, 512); let s = 7;
  for (let i = 0; i < im.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; im.data[i] = im.data[i + 1] = im.data[i + 2] = s % 256; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }
grain.style.width = '2160px'; grain.style.height = '3840px';

// which step is on screen at time t (the phone keeps the last one during the outro)
const stepAt = t => { let i = 0; while (i + 1 < STEPS.length && t >= T0[i + 1]) i++; return i; };

window.render = function (t) {
  tf($id('gw1'), `translate(${-300 + Math.sin(t * .23) * 200}px,${-200 + Math.cos(t * .19) * 160}px)`);
  tf($id('gw2'), `translate(${300 + Math.cos(t * .21) * 200}px,${1200 + Math.sin(t * .17) * 200}px)`);
  const f = Math.floor(t * 24); tf(grain, `translate(${-((f * 173) % 500)}px,${-((f * 97) % 500)}px)`);
  // intro
  const inI = show($id('intro'), t < INTRO + .5);
  if (inI) {
    tf($id('grad'), `rotate(${Math.sin(t * .4) * 6}deg) scale(1.05)`);
    tf($id('hl1'), `translate(${-200 + Math.sin(t * .7) * 260}px,${200 + Math.cos(t * .5) * 180}px)`);
    tf($id('hl2'), `translate(${500 + Math.cos(t * .6) * 220}px,${1200 + Math.sin(t * .8) * 200}px)`);
    const ch = P(t, .05, .4, outB); op($id('ichip'), cl(ch * 2)); tf($id('ichip'), `translateY(${(1 - ch) * 30}px)`);
    EP.L.forEach((e, k) => { const tb = BEAT * (1 + k), q = P(t, tb, tb + .3, outB), a = P(t, tb, tb + .07);
      tf(e, `translateY(${(1 - q) * 40}px) scale(${lerp(1.3, 1, q)}) rotate(${(1 - q) * -4}deg)`); e.style.filter = `blur(${(1 - a) * 10}px)`; op(e, a); });
    const su = P(t, 3.2 * BEAT, 3.2 * BEAT + .5, outX); op($id('isub'), su); tf($id('isub'), `translateY(${(1 - su) * 24}px)`);
    // wipe up into the dark stage
    const w = P(t, INTRO - .45, INTRO + .05, ioC); tf($id('intro'), `translateY(${-w * 1920}px)`);
  }
  // phone + captions
  const onP = t > INTRO - .6 && t < END - .3;
  show($id('cam'), onP); show($id('cap'), onP); show($id('capbg'), onP); show($id('prog'), onP);
  const endT = END - OUTRO;
  if (onP) {
    const i = stepAt(t), s = STEPS[i];
    const inn = P(t, INTRO - .5, INTRO + .35, outB), out = P(t, endT - .1, endT + .35, inC);
    // zoom: the step's box grows to ~900px wide and moves to (540, 1180), from 1 beat in to 1.5 beats before the end
    let z = 0, k = 1, cx = 0, cy = 0;
    if (s.zoom) {
      const [x, y, w, h] = s.zoom; k = Math.min(2.1, 920 / (w * K), 820 / (h * K));
      z = P(t, T0[i] + BEAT, T0[i] + 2.2 * BEAT, ioC) * (1 - P(t, T0[i] + DUR[i] - 1.6 * BEAT, T0[i] + DUR[i] - .5 * BEAT, ioC));
      cx = 14 + (x + w / 2) * K; cy = 14 + (y + h / 2) * K;
      op(s.hb, P(t, T0[i] + 2 * BEAT, T0[i] + 2.4 * BEAT) * (1 - P(t, T0[i] + DUR[i] - 2 * BEAT, T0[i] + DUR[i] - 1.6 * BEAT)));
      Object.assign(s.hb.style, { left: x * K - 6 + 'px', top: y * K - 6 + 'px', width: w * K + 12 + 'px', height: h * K + 12 + 'px' });
    }
    else {
      // no explicit zoom: a slow push-in towards the first tap (or the screen centre), released as the step ends
      const tp = (s.taps || [])[0], fx = tp ? tp.cx : DEV.sw / 2, fy = tp ? tp.cy : DEV.sh * .46;
      z = P(t, T0[i] + .3, T0[i] + DUR[i] - .25, x => ioC(x)) * (1 - P(t, T0[i] + DUR[i] - .25, T0[i] + DUR[i] + .05, ioC)) * (i > 0 || t > INTRO ? 1 : 0);
      k = 1.1; cx = 14 + fx; cy = 14 + fy;
      const nx = 540 - PH_X - cx, ny = 1180 - PH_Y - cy;   // push drifts only a little towards the focus
      z *= 1; s._drift = [nx * .12, Math.max(ny * .12, -40)];
    }
    STEPS.forEach(q => { if (q.hb && q !== s) op(q.hb, 0); });
    // phone flies in from below and leaves to the right; the zoom scales around the box centre
    const dx = s.zoom ? 540 - PH_X - cx : s._drift[0], dy = s.zoom ? 1180 - PH_Y - cy : s._drift[1];
    const px = PH_X + z * dx + out * 1100, py = PH_Y + z * dy + (1 - inn) * 1500;
    tf($id('phw'), `translate(${px}px,${py}px) translate(${cx}px,${cy}px) scale(${lerp(1, k, z)}) rotate(${(1 - inn) * -10 + out * 14}deg) translate(${-cx}px,${-cy}px)`);
    // screenshots: crossfade into each new step
    STEPS.forEach((q, k) => { const a = k === i ? P(t, T0[k] - .05, T0[k] + .22) : (k === i - 1 ? 1 : 0);
      op(q.img_el, a); q.img_el.style.zIndex = k === i ? 2 : 1; tf(q.img_el, k === i ? `scale(${lerp(1.012, 1, P(t, T0[k], T0[k] + .35, outX))})` : 'none'); });
    // captions: title + sub slide in, previous one leaves upward
    STEPS.forEach((q, k) => {
      const a = P(t, T0[k] + .05, T0[k] + .45, outX), b = P(t, T0[k] + .12, T0[k] + .55, outX);
      const gone = k < STEPS.length - 1 ? P(t, T0[k + 1] - .18, T0[k + 1] + .05) : P(t, endT - .2, endT + .1);
      const vis = t >= T0[k] - .01 && gone < 1;
      show(q.t_el, vis); show(q.s_el, vis);
      if (vis) { op(q.t_el, a * (1 - gone)); tf(q.t_el, `translateY(${(1 - a) * 40 - gone * 30}px)`); q.t_el.style.filter = `blur(${(1 - a) * 8}px)`;
        op(q.s_el, b * (1 - gone)); tf(q.s_el, `translateY(${(1 - b) * 30 - gone * 30}px)`); }
      q.bar.style.transform = `scaleX(${P(t, T0[k], T0[k] + DUR[k])})`;
    });
    // fingers

    }));

};
const PROBE = () => [...document.querySelectorAll('.ln,#isub,#ichip,#intro,#phw,.ct,.cs,.fing,.rip,.hbox,#logo,.word,.small,.pill')];
function rects() { return PROBE().map(e => { const r = e.getClientRects().length ? e.getBoundingClientRect() : null; return r && r.width ? [r.left, r.top, r.right, r.bottom] : null; }); }

};
window.ready = load().then(() => render(0));
</script>
