<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SalaFlow — lancio</title>
<style>
@font-face{font-family:PJS;font-weight:400;src:url(font/PJS-400.ttf)}
@font-face{font-family:PJS;font-weight:500;src:url(font/PJS-500.ttf)}
@font-face{font-family:PJS;font-weight:600;src:url(font/PJS-600.ttf)}
@font-face{font-family:PJS;font-weight:700;src:url(font/PJS-700.ttf)}
@font-face{font-family:PJS;font-weight:800;src:url(font/PJS-800.ttf)}
@font-face{font-family:Caveat;font-weight:600;src:url(font/Caveat.ttf)}
@font-face{font-family:DMSerif;src:url(font/DMSerif.ttf)}

:root{
  --bg:#0a0e0d; --mint:#2dd8a3; --mint-l:#7bf0c8; --ink:#f2f7f5; --mute:#9fb3ab;
  /* app */
  --a-bg:#0b1222; --a-card:#111a2c; --a-card2:#0f1728; --a-line:rgba(148,163,184,.14);
  --a-text:#e6ebf2; --a-mute:#8b97ab; --a-teal1:#2dd4bf; --a-teal2:#22d3ee;
  --a-blue:#1d4ed8; --a-indigo:#4f46e5; --a-purple:#7c3aed; --a-green:#16a34a; --a-red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body{font-family:PJS,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg);perspective:2400px}
.abs{position:absolute}
.world{position:absolute;inset:0;transform-style:preserve-3d}

/* ---------- background ---------- */
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
#grain{position:absolute;inset:-50%;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.65) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(123,240,200,.55),rgba(45,216,163,0) 60%);opacity:0;pointer-events:none;mix-blend-mode:screen}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* ---------- captions ---------- */
.cap{position:absolute;display:flex;flex-direction:column;gap:26px}
.kick{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);display:flex;align-items:center;gap:14px;font-size:24px}
.kick i{display:block;width:34px;height:2px;background:var(--mint);box-shadow:0 0 12px var(--mint);transform-origin:left}
.line{display:block;overflow:hidden;padding:.06em 0 .12em;margin:-.06em 0 -.12em}
.w{display:inline-block;will-change:transform}
.head{font-weight:800;letter-spacing:-.025em;word-spacing:.06em;line-height:1.06}
.mint{color:var(--mint)}
.V .cap{align-items:center;text-align:center}
.V .kick{justify-content:center}

/* ---------- notebook ---------- */
#paper{position:absolute;width:560px;height:700px;left:-280px;top:-350px;border-radius:10px;
  background:
    linear-gradient(90deg,transparent 70px,rgba(220,80,80,.45) 70px,rgba(220,80,80,.45) 72px,transparent 72px),
    repeating-linear-gradient(180deg,transparent 0 47px,rgba(80,120,170,.28) 47px 48px),
    #f4efe3;
  box-shadow:0 60px 120px -30px rgba(0,0,0,.8),inset 0 0 80px rgba(120,90,40,.18);
  font-family:Caveat;color:#23324a;transform-style:preserve-3d}
#paper .ttl{position:absolute;left:92px;top:40px;font-size:46px;color:#1c2b44}
#paper .e{position:absolute;left:92px;font-size:40px;white-space:nowrap;overflow:hidden}
#paper svg{position:absolute;inset:0;overflow:visible}
#paper path{fill:none;stroke:#b3261e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- logo ---------- */
.logoimg{border-radius:22.5%;overflow:hidden;position:relative;box-shadow:0 30px 80px -20px rgba(45,216,163,.45)}
.logoimg img{width:100%;height:100%;display:block;transform:scale(1.025)}
.sheen{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);mix-blend-mode:screen}
.ring{position:absolute;border-radius:50%;border:2px solid var(--mint);box-shadow:0 0 30px var(--mint),inset 0 0 30px rgba(45,216,163,.4)}

/* ---------- phone ---------- */
.dev{position:absolute;left:0;top:0;transform-style:preserve-3d}
.phone{position:absolute;width:414px;height:868px;left:-207px;top:-434px;transform-style:preserve-3d}
.phone .frame{position:absolute;inset:0;border-radius:64px;
  background:linear-gradient(145deg,#3a4046,#15181b 30%,#0c0e10 60%,#2c3136);
  box-shadow:0 80px 140px -30px rgba(0,0,0,.85),0 0 0 1.5px rgba(255,255,255,.08) inset,0 0 60px -10px rgba(45,216,163,.25)}
.phone .scr{transform:translateZ(1px);position:absolute;left:12px;top:12px;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--a-bg)}
.island{position:absolute;left:50%;top:11px;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px;z-index:50}
.glare{position:absolute;inset:0;border-radius:52px;pointer-events:none;z-index:60;
  background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%)}

/* ---------- tablet ---------- */
.tablet{position:absolute;width:1060px;height:760px;left:-530px;top:-380px;transform-style:flat}
.tablet .frame{position:absolute;inset:0;border-radius:46px;background:linear-gradient(145deg,#3a4046,#121416 35%,#0c0e10 65%,#2c3136);
  box-shadow:0 80px 140px -30px rgba(0,0,0,.85),0 0 0 1.5px rgba(255,255,255,.08) inset}
.tablet .scr{transform:translateZ(1px);position:absolute;left:20px;top:20px;width:1020px;height:720px;border-radius:28px;overflow:hidden;background:var(--a-bg)}

/* ---------- app UI ---------- */
.app{position:absolute;inset:0;font-family:PJS;color:var(--a-text);font-size:13px}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:700;font-size:16px;z-index:40}
.sb svg{height:13px}
.hdr{position:absolute;left:14px;right:14px;top:58px;height:78px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px;padding:0 10px;background:linear-gradient(180deg,#0e1628,#0c1324);border-bottom:1px solid var(--a-line)}
.hdr .lg{width:46px;height:46px;border-radius:12px;background:#fff center/cover;flex:none}
.hdr .nm{font-family:DMSerif;font-size:19px;color:#f1f4f9;line-height:1.1}
.hdr .sub{font-size:11.5px;font-weight:600;color:var(--a-teal1);margin-top:3px}
.hdr .hb{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--a-line);background:#141d31;display:grid;place-items:center}
.hdr .hb i{display:block;width:16px;height:2px;background:#cbd5e1;box-shadow:0 5px 0 #cbd5e1,0 -5px 0 #cbd5e1}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:18px}
.pane{position:absolute;left:0;right:0;top:150px;bottom:0}
.nav{position:absolute;left:14px;right:14px;bottom:22px;height:74px;border-radius:24px;background:rgba(14,21,37,.96);border:1px solid var(--a-line);display:flex;align-items:center;justify-content:space-around;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.nav .it{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#7c889c;font-weight:600;width:56px}
.nav .it svg{width:20px;height:20px;stroke:#7c889c;fill:none;stroke-width:1.8}
.nav .it.on{color:var(--a-teal1)}
.nav .it.on .ic{width:34px;height:34px;border-radius:50%;background:var(--a-teal1);display:grid;place-items:center;margin-top:-10px}
.nav .it.on svg{stroke:#06231a}
.nav .plus{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--a-teal1),var(--a-teal2));display:grid;place-items:center;box-shadow:0 8px 24px rgba(45,212,191,.45);color:#fff;font-size:34px;font-weight:500;line-height:1}
.legend{position:absolute;left:14px;right:14px;top:14px;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;color:#c3cad6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ib{width:32px;height:32px;border-radius:9px;border:1px solid var(--a-line);background:#18223a;display:grid;place-items:center;color:#cbd5e1;font-size:16px}
.dash{position:absolute;left:14px;right:14px;top:84px;height:40px;border:1.5px dashed rgba(148,163,184,.3);border-radius:14px;display:grid;place-items:center;font-size:12px;color:#c3cad6;font-weight:500}
.zone{position:absolute;left:14px;right:14px;top:138px;bottom:0;border-radius:18px 18px 0 0}
.zone .zt{position:absolute;left:16px;top:16px;font-weight:700;font-size:15px}
.zone .zc{position:absolute;right:52px;top:19px;font-size:11px;color:var(--a-mute)}
.map{position:absolute;left:16px;right:16px;top:58px;bottom:0;border-radius:14px;background:
  linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px) 0 0/22px 22px,#0d1526;border:1px solid var(--a-line)}
.tb{position:absolute;border-radius:5px;border:1.5px solid;display:grid;place-items:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.75)}
.tb.g{border-color:#16a34a;background:rgba(21,128,61,.35)}
.tb.r{border-color:#dc2626;background:rgba(127,29,29,.65)}
.tb.b{border-color:#3b5bdb;background:rgba(30,58,160,.55)}
.dim{position:absolute;inset:0;background:rgba(3,7,18,.72);z-index:20}
.sheet{position:absolute;left:18px;right:18px;border-radius:20px;background:#121b2e;border:1px solid rgba(148,163,184,.2);z-index:25;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase}
.btn.o{border:1px solid var(--a-line);background:#0f1728;color:#c7d2fe}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toast{position:absolute;left:50%;white-space:nowrap;padding:11px 18px;border-radius:999px;font-weight:700;font-size:12px;z-index:35;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.gr{background:#15803d;color:#eafff3;border:1px solid #22c55e}
.toast.pu{background:#6d28d9;color:#f5f0ff;border:1px solid #8b5cf6}
.teal{background:linear-gradient(120deg,var(--a-teal1),var(--a-teal2));border-radius:20px;color:#fff}
.tile{position:absolute;width:84px;height:94px;border-radius:14px;border:1.5px solid rgba(34,197,94,.55);background:linear-gradient(180deg,#0f2a22,#0d1c1a);text-align:center;padding-top:10px}
.tile b{display:block;font-size:26px;font-weight:800;color:#86efac;line-height:1.05}
.tile s{display:block;text-decoration:none;font-size:10px;color:#cbd5e1;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile u{display:inline-block;text-decoration:none;font-size:9px;color:#94a3b8;margin-top:4px}
.tile u:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#e2e8f0;margin-right:4px;vertical-align:0}
.tile.red{border-color:rgba(239,68,68,.8);background:linear-gradient(180deg,#3b0d14,#260a10)}
.tile.red b{color:#fca5a5}
.tile.blue{border-color:rgba(96,165,250,.8);background:linear-gradient(180deg,#0f1f47,#0b1633)}
.tile.blue b{color:#bfdbfe}
.ck{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;background:#0f1728;border:1px solid var(--a-line);font-size:12.5px;color:#dbe3ee}
.ck .bx{width:17px;height:17px;border-radius:5px;background:#f1f5f9;flex:none;display:grid;place-items:center}
.ck .bx svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}
.ck.on{border-color:rgba(45,212,191,.6);background:rgba(20,83,74,.45)}
.ck.on .bx{background:var(--a-teal1)}
.tap{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;z-index:70;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.9) 0 9px,rgba(255,255,255,.35) 10px 13px,transparent 14px);
  box-shadow:0 0 0 2px rgba(255,255,255,.6)}

/* pop-out cards (float off the phone in 3D) */
.pop{position:absolute;left:0;top:0;border-radius:18px;white-space:nowrap;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08) inset}

/* kitchen node */
#kitchen{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:18px 26px 18px 18px;border-radius:24px;background:rgba(18,24,21,.9);border:1px solid rgba(45,216,163,.35);box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
#kitchen .ki{width:54px;height:54px;border-radius:16px;background:rgba(45,216,163,.14);display:grid;place-items:center}
#kitchen .ki svg{width:30px;height:30px;stroke:var(--mint);fill:none;stroke-width:1.8}
#ticket{position:absolute;left:0;top:0;padding:12px 16px;border-radius:14px;background:#f6f3ea;color:#18202b;font-weight:700;font-size:15px;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}
#beam{position:absolute;left:0;top:0;overflow:visible}

/* end */
.cta{display:inline-flex;align-items:center;gap:14px;border-radius:999px;background:var(--mint);color:#05241a;font-weight:800;position:relative;overflow:hidden;box-shadow:0 18px 50px -12px rgba(45,216,163,.7)}
.cta .shine{position:absolute;top:-20%;bottom:-20%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent)}
.recap{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.035em}
</style>
</head>
<body>
<div id="stage">
  <div id="bgl" class="abs" style="inset:0">
    <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div>
  </div>
  <div class="world" id="world"></div>
  <div id="ui" class="abs" style="inset:0"></div>
  <div id="flash"></div>
  <canvas id="grain"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script>
/* ============================================================
   Deterministic motion engine: window.render(t) draws frame at t
   ============================================================ */
const Q = new URLSearchParams(location.search);
const V = Q.get('f') === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
document.body.classList.toggle('V', V);
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- music grid (112 BPM, first downbeat 0.163s) ----------
const BAR = 2.1413, B0 = 0.163;
const bar = n => B0 + n * BAR;
const beat = n => B0 + n * BAR / 4;
const END = 47.3;

// ---------- easing ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  lin: x => x,
  inC: x => x * x * x,
  outC: x => 1 - Math.pow(1 - x, 3),
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQ: x => 1 - Math.pow(1 - x, 5),
  ioQ: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outX: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
  ioX: x => x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  inX: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  outB: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spr: x => x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x) * (1 - x) - 0 * x, // soft spring settling at 1
};
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, t0, t1, ease = E.ioC) => ease(cl((t - t0) / (t1 - t0)));
// keyframe track of objects: [[time, {..}, ease], ...]  (ease used to arrive at that key)
function track(keys, t) {
  if (t <= keys[0][0]) return { ...keys[0][1] };
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e = E.ioC] = keys[i], [t0, v0] = keys[i - 1];
    if (t < t1) {
      const x = e(cl((t - t0) / (t1 - t0))), o = {};
      for (const k in v1) o[k] = lerp(v0[k] ?? v1[k], v1[k], x);
      for (const k in v0) if (!(k in o)) o[k] = v0[k];
      return o;
    }
  }
  const o = {}; for (const [, v] of keys) Object.assign(o, v); return o;
}
// carry forward missing props so each key is complete
function full(keys) { let acc = {}; return keys.map(([t, v, e]) => (acc = { ...acc, ...v }, [t, { ...acc }, e])); }

// ---------- DOM helpers ----------
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; return el; };
const show = (el, on) => { if (el._d === undefined) el._d = el.style.display === 'none' ? '' : el.style.display; el.style.display = on ? el._d : 'none'; return on; };
const tf = (el, s) => el.style.transform = s;
const op = (el, v) => el.style.opacity = v;

// ---------- layout ----------
const L = V ? {
  px: 540, py: 800, s: 1.3, capX: 60, capY: 1500, capW: 960, capAlign: 'center', headSize: 78, kickSize: 26,
  pop: 1.0, tabX: 520, tabY: 560, tabS: 1.0, phX: 790, phY: 1080, phS: .5,
  kitX: 540, kitY: 150, recap: 150,
} : {
  px: 1300, py: 545, s: 1.0, capX: 150, capY: 540, capW: 760, capAlign: 'left', headSize: 86, kickSize: 24,
  pop: 1.0, tabX: 700, tabY: 600, tabS: 1.0, phX: 1480, phY: 640, phS: .7,
  kitX: 1640, kitY: 170, recap: 150,
};

/* ============================================================
   Background: drifting orbs + film grain
   ============================================================ */
const o1 = document.getElementById('o1'), o2 = document.getElementById('o2'), o3 = document.getElementById('o3');
css(o1, { width: '900px', height: '900px', background: 'rgba(45,216,163,.20)' });
css(o2, { width: '700px', height: '700px', background: 'rgba(34,211,238,.12)' });
css(o3, { width: '800px', height: '800px', background: 'rgba(45,216,163,.10)' });
const grain = document.getElementById('grain');
grain.width = 512; grain.height = 512;
{ const g = grain.getContext('2d'), im = g.createImageData(512, 512); let s = 1234567;
  for (let i = 0; i < im.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = s % 256; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }
css(grain, { width: (W * 2) + 'px', height: (H * 2) + 'px', imageRendering: 'pixelated' });

function drawBG(t, energy) {
  const a = t * .25;
  tf(o1, `translate(${W * .62 + Math.sin(a) * 180 - 450}px,${H * .45 + Math.cos(a * .8) * 120 - 450}px) scale(${1 + energy * .25})`);
  tf(o2, `translate(${W * .2 + Math.cos(a * .7) * 220 - 350}px,${H * .75 + Math.sin(a * 1.1) * 140 - 350}px)`);
  tf(o3, `translate(${W * .85 + Math.sin(a * .6 + 2) * 160 - 400}px,${H * .12 + Math.cos(a * .9) * 100 - 400}px)`);
  const f = Math.floor(t * 24); // grain moves at 24fps like film
  tf(grain, `translate(${-((f * 173) % 400)}px,${-((f * 97) % 400)}px)`);
}

/* ============================================================
   Captions (kinetic word reveal)
   ============================================================ */
const UI = document.getElementById('ui');
if (V) UI.appendChild($(`<div class="abs" style="left:0;right:0;top:1300px;bottom:0;background:linear-gradient(180deg,rgba(10,14,13,0) 0%,rgba(10,14,13,.88) 30%,rgba(10,14,13,.96) 100%)"></div>`));
function mkCap(kick, lines, opt = {}) {
  const size = opt.size || L.headSize;
  const el = $(`<div class="cap"></div>`);
  if (kick) el.appendChild($(`<div class="kick" style="font-size:${L.kickSize}px"><i></i><span>${kick}</span></div>`));
  const hd = $(`<div class="head" style="font-size:${size}px"></div>`);
  lines.forEach(l => {
    const ln = $(`<span class="line"></span>`);
    l.split(' ').forEach((w, i) => { if (i) ln.appendChild(document.createTextNode(' ')); const m = w.startsWith('~'); ln.appendChild($(`<span class="w${m ? ' mint' : ''}">${m ? w.slice(1) : w}</span>`)); });
    hd.appendChild(ln);
  });
  el.appendChild(hd);
  if (V) css(el, { left: L.capX + 'px', width: L.capW + 'px', top: (opt.y ?? L.capY) + 'px' });

  const tS = bar(16) - .1;
  const q = P(t, tS, tS + .6, E.outB);
  show(newTab, t > tS - .1); tf(newTab, `scale(${q})`); op(newTab, cl(q * 2));
  newTab.style.boxShadow = `0 0 ${20 * (1 - P(t, tS, tS + 1.5))}px 6px rgba(239,68,68,${.6 * (1 - P(t, tS, tS + 1.5))})`;
  // beam between devices
  const bk = P(t, tS - .5, tS, E.ioC), bo = P(t, tS + .2, tS + .8);
  if (show(beam, bk > 0 && bo < 1)) {
    const p = track(PH, t);
    const ax = p.x - 139 * p.s, ay = p.y - 83 * p.s;
    const bx = V ? 150 : 362, by = V ? 712 : 700;
    const cx = (ax + bx) / 2, cy = Math.min(ay, by) - 160;
    bp.setAttribute('d', `M${ax},${ay} Q${cx},${cy} ${bx},${by}`);
    const len = bp.getTotalLength();
    bp.style.strokeDasharray = `${len * .35} ${len}`; bp.style.strokeDashoffset = `${len * .35 - bk * len * 1.35}`;
    const pt = bp.getPointAtLength(len * bk);
    bd.setAttribute('cx', pt.x); bd.setAttribute('cy', pt.y);
    op(beam, 1 - bo);
  }
}

/* ============================================================
   Scene J — rapid recap on the beat + Locanda line
   Scene K — end card
   ============================================================ */
const RECAP = ['Prenotazioni.', 'Walk-in.', 'Accoglienza.', 'Comande.', 'Cassa.'];
const recap = RECAP.map(w => { const e = $(`<div class="recap" style="font-size:${V ? 150 : 190}px;top:${H / 2 - (V ? 95 : 120)}px">${w}</div>`); UI.appendChild(e); return e; });
const capLoc = mkCap('Sul campo', ['Già al lavoro alla', '~Locanda ~Del ~Convento.'],
  V ? { y: 760, size: 76 } : { x: 160, y: 540, w: 1600, size: 84 });
if (!V) { capLoc.style.alignItems = 'center'; capLoc.style.textAlign = 'center'; capLoc.style.left = '160px'; capLoc.querySelector('.kick').style.justifyContent = 'center'; }
const locLogo = $(`<div class="abs" style="left:0;top:0;width:${V ? 150 : 120}px;height:${V ? 150 : 120}px;border-radius:30px;background:#fff url(locanda.png) center/cover;box-shadow:0 30px 60px -10px rgba(0,0,0,.7)"></div>`);
UI.appendChild(locLogo);

function drawRecap(t) {
  const base = bar(17);
  recap.forEach((e, i) => {
    const tin = base + i * BAR / 4 * 1, tout = tin + BAR / 4;
    const on = show(e, t > tin - .02 && t < tout + .15);
    if (!on) return;
    const k = P(t, tin, tin + .35, E.outX), o = P(t, tout - .05, tout + .15, E.inC);
    tf(e, `scale(${1.25 - .25 * k + o * .08}) translateY(${o * -20}px)`);
    e.style.filter = `blur(${(1 - k) * 12 + o * 10}px)`;
    op(e, k * (1 - o));
    e.style.color = i === RECAP.length - 1 ? 'var(--mint)' : 'var(--ink)';
  });
  drawCap(capLoc, t, bar(18.3), bar(19) - .05);
  const lo = show(locLogo, t > bar(18.3) - .05 && t < bar(19) + .1);
  if (lo) {
    const k = P(t, bar(18.3), bar(18.3) + .7, E.outB), o = P(t, bar(19) - .45, bar(19) - .05, E.inC);
    const lx = V ? 540 - 75 : W / 2 - 60, ly = V ? 520 : 220;
    tf(locLogo, `translate(${lx}px,${ly}px) scale(${.6 + .4 * k})`); op(locLogo, k * (1 - o)); locLogo.style.filter = `blur(${o * 8}px)`;
  }
}

const EL = V ? 250 : 190;
const endBox = $(`<div class="abs" style="left:0;top:0;width:${W}px;height:${H}px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <div class="elogo" style="position:relative;width:${EL}px;height:${EL}px"><div class="ring" style="inset:0"></div><div class="logoimg" style="width:100%;height:100%"><img src="../../logo.png"><div class="sheen"></div></div></div>
  <div class="head eh" style="font-size:${V ? 92 : 96}px;margin-top:${V ? 60 : 46}px"></div>
  <div class="cta" style="margin-top:${V ? 76 : 56}px;padding:${V ? '32px 66px' : '26px 58px'};font-size:${V ? 46 : 38}px"><span>Prenota una visita</span><span style="font-size:.9em">→</span><div class="shine"></div></div>
  <div class="url" style="margin-top:${V ? 36 : 28}px;font-size:${V ? 40 : 34}px;font-weight:700;color:#cfe0da;letter-spacing:.02em">salaflow.com</div>
  <div class="team" style="margin-top:${V ? 110 : 64}px;font-size:${V ? 28 : 22}px;font-weight:500;color:#6f8580">Fatto da Luca, Filippo e Antonio</div>
</div>`);
UI.appendChild(endBox);
const eLogo = endBox.querySelector('.elogo'), eRing = endBox.querySelector('.ring'), eSheen = endBox.querySelector('.sheen'), eh = endBox.querySelector('.eh'),
  cta = endBox.querySelector('.cta'), shine = endBox.querySelector('.shine'), url = endBox.querySelector('.url'), team = endBox.querySelector('.team');
const ehW = [];
[['Dalla', ''], ['sala,', ''], ['per', 'mint'], ['la', 'mint'], ['sala.', 'mint']].forEach(([w, c], i) => {
  if (i) eh.appendChild(document.createTextNode(' '));
  if (V && i === 2) eh.appendChild(document.createElement('br'));
  const ln = $(`<span class="line" style="display:inline-block"><span class="w ${c}">${w}</span></span>`); eh.appendChild(ln); ehW.push(ln.firstChild);
});
function drawEnd(t) {
  const t0 = bar(19);
  if (!show(endBox, t > t0 - .05)) return;
  const k = P(t, t0, t0 + 1, E.outX);
  tf(eLogo, `perspective(900px) rotateY(${(1 - k) * 40}deg) scale(${.5 + .5 * k})`); eLogo.style.filter = `blur(${(1 - k) * 14}px)`; op(eLogo, cl(k * 2));
  const rk = P(t, t0 + .1, t0 + 1.5, E.outC); tf(eRing, `scale(${1 + rk * 2})`); op(eRing, (1 - rk) * .8 * (rk > 0));
  tf(eSheen, `translateX(${lerp(-120, 120, P(t, t0 + .5, t0 + 1.4))}%)`);
  ehW.forEach((w, i) => { const q = P(t, t0 + .35 + i * .07, t0 + 1.1 + i * .07, E.outX); tf(w, `translateY(${(1 - q) * 110}%)`); w.style.filter = `blur(${(1 - q) * 6}px)`; op(w, q); });
  const c = P(t, bar(19.5), bar(19.5) + .8, E.outB);
  tf(cta, `translateY(${(1 - c) * 40}px) scale(${.85 + .15 * c})`); op(cta, cl(c * 1.5));
  const shT = ((t - bar(20)) % 1.8) / 1.8; tf(shine, `translateX(${t > bar(20) ? lerp(-150, 350, E.ioC(cl(shT * 1.6))) : -150}%)`);
  const u = P(t, bar(19.75), bar(19.75) + .8, E.outX); tf(url, `translateY(${(1 - u) * 20}px)`); op(url, u);
  const tm = P(t, bar(20.1), bar(20.1) + 1, E.outC); op(team, tm);
  // gentle push-in over the whole end card
  tf(endBox, `scale(${1 + P(t, t0, END, E.lin) * .04})`);
}

/* ============================================================
   Master render
   ============================================================ */
const flash = document.getElementById('flash'), fade = document.getElementById('fade');
window.render = function (t) {
  const energy = t > bar(9) ? .6 + .4 * Math.pow(1 - ((t - B0) % (BAR / 4)) / (BAR / 4), 3) : .2;
  drawBG(t, energy);
  drawA(t); drawB(t); drawPhone(t); drawKitchen(t); drawTablet(t); drawRecap(t); drawEnd(t);
  for (const k in C) show(C[k], false);
  drawCap(C.map, t, bar(4) + .6, bar(5.45));
  drawCap(C.walk, t, bar(6) + .3, bar(8) - .05);
  drawCap(C.search, t, bar(8) + .2, bar(9) - .1);
  drawCap(C.grid, t, bar(9) + .25, bar(10.6));
  drawCap(C.alg, t, bar(11) + .2, bar(13) - .1);
  drawCap(C.com, t, bar(13) + .2, bar(15) - .1);
  drawCap(C.sync, t, bar(15) + .5, bar(17) - .1);
  // flashes on the big cuts
  const fl = Math.max(
    1 - cl(Math.abs(t - bar(2)) / .35), 1 - cl(Math.abs(t - bar(9)) / .3) * 1, 1 - cl(Math.abs(t - bar(19)) / .4));
  op(flash, fl * .9);
  op(fade, Math.max(1 - P(t, 0, .5), P(t, END - .9, END - .05)));
};
window.DURATION = END;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r))));
render(0);
</script>
</body>
</html>
